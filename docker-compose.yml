services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: secondbrain 
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: secondbrain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports: 
      - "6379:6379"
volumes:
  pgdata: